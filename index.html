<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Laboratório Tech • MathLab 2026</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
</head>
<body>

  <section id="splash-screen" class="screen">
    <div class="splash-inner">
      <h1 class="splash-logo">LABORATÓRIO TECH</h1>
      <p class="splash-sub">Recomposição de Aprendizagem • Módulos 1-6</p>
      <div class="splash-av">
        <div class="av-box">
          <img src="assets/img/avatar_estatico.png" class="ada-avatar-asset" alt="ADA">
        </div>
      </div>
      <div class="input-group">
        <input type="text" id="nome-cientista" placeholder="Nome do Cientista">
        <input type="text" id="turma-cientista" placeholder="Turma (ex: 7ºA)">
      </div>
      <button class="btn-start" id="btn-acessar">INICIALIZAR SISTEMA</button>
    </div>
  </section>

  <section id="block-selector" class="screen hidden">
    <div class="selector-inner">
      <h2 class="section-title">SETOR DE DIAGNÓSTICO</h2>
      <div class="blocks-grid">
        <button class="block-card b1" id="btn-bloco-1"><span class="block-icon">🔢</span><span class="block-name">Base Numérica</span></button>
        <button class="block-card b2" id="btn-bloco-2"><span class="block-icon">⚖️</span><span class="block-name">Operações</span></button>
        <button class="block-card b3" id="btn-bloco-3"><span class="block-icon">📏</span><span class="block-name">Medidas</span></button>
        <button class="block-card b4" id="btn-bloco-4"><span class="block-icon">🧩</span><span class="block-name">Álgebra</span></button>
        <button class="block-card b5" id="btn-bloco-5"><span class="block-icon">📊</span><span class="block-name">Estatística</span></button>
        <button class="block-card b6" id="btn-bloco-6"><span class="block-icon">📐</span><span class="block-name">Geometria II</span></button>
      </div>
      <button class="bc2" onclick="location.reload()" style="margin-top:20px; cursor:pointer;">← Alterar Usuário</button>
    </div>
  </section>

  <section id="game-screen" class="screen hidden">
    <div class="gw">
      <header class="game-header">
        <div class="hud-item">
          <span class="hud-label">INTEGRIDADE</span>
          <div class="bar"><div id="fv" class="fill"></div></div>
        </div>
        <div class="hud-item">
          <span class="hud-label">NÍVEL</span>
          <span id="tnv" class="hud-value">1</span>
        </div>
        <div class="game-controls">
          <button class="mini-btn" id="btn-musica">🎵 <span id="tsom">OFF</span></button>
          <button class="mini-btn" data-action="seletor">⚙️ Blocos</button>
        </div>
      </header>

      <main class="question-container">
        <div id="conta-display"></div>
        <div id="grid-botoes" class="ag"></div>
        <button id="btn-prox" class="hidden btn-next">PRÓXIMO DESAFIO →</button>
      </main>
    </div>
  </section>

  <div id="ada-command-post">
    <div class="ada-halo"></div>
    <div class="ada-box">
      <img src="assets/img/avatar_estatico.png" id="av-img" class="ada-asset">
      <video id="vid-ok" class="ada-asset avh" playsinline muted><source src="assets/vid/ada_sucesso.mp4" type="video/mp4"></video>
      <video id="vid-no" class="ada-asset avh" playsinline muted><source src="assets/vid/ada_alerta.mp4" type="video/mp4"></video>
    </div>
  </div>

  <div class="side-controls">
    <button class="btn-round" id="btn-perfil">👤</button>
    <button class="btn-round" id="btn-dash">📊</button>
    <button class="btn-round" id="btn-cred">i</button>
  </div>

  <div id="mperfil" class="modal">
    <div class="mc">
      <button class="mx">✕</button>
      <h2>PERFIL DO CIENTISTA</h2>
      <p id="perfil-nome-display" style="color: var(--neon-cyan); font-weight: bold;"></p>
      <div style="display: flex; justify-content: space-around; margin-top: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px;">
        <div>Acertos: <span id="perfil-acertos-display" style="color: var(--neon-green);">0</span></div>
        <div>Vida: <span id="perfil-vida-display" style="color: var(--neon-red);">100</span></div>
      </div>
    </div>
  </div>

  <div id="mdash" class="modal">
    <div class="mc">
      <button class="mx">✕</button>
      <h2>TELEMETRIA BNCC</h2>
      <div id="dash-content" style="max-height: 300px; overflow-y: auto; margin: 15px 0;">
        </div>
    </div>
  </div>

  <div id="mcred" class="modal">
    <div class="mc">
      <button class="mx">✕</button>
      <h2>CRÉDITOS</h2>
      <p><b>MathLab 2026</b><br>Autor: Prof. Alê Chocolate</p>
    </div>
  </div>

  <div id="go" class="modal">
    <div class="mc">
      <h2 style="color: var(--neon-red);">SISTEMA REINICIADO</h2>
      <p>A integridade da ADA chegou ao limite.</p>
      <button class="btn-start" id="btn-reiniciar" style="margin-top: 20px;">RECONECTAR</button>
      <button class="bc2" data-action="seletor" style="margin-top: 10px; cursor: pointer; border: none; background: none; color: white;">Voltar ao Menu</button>
    </div>
  </div>

  <audio id="bgm" loop><source src="assets/snd/trilha.mp3" type="audio/mpeg"></audio>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
